[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-security-intelligence-copilot"
version = "0.1.0"
description = "Local, synthetic enterprise security intelligence demonstration"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.5",
  "qdrant-client==1.19.1",
  "sentence-transformers==6.0.1",
  "pypdf==6.19.0",
  "httpx==0.28.1",
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "langgraph==1.2.11",
  "scikit-learn==1.9.1",
  "mlflow==3.16.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
  "reportlab==4.4.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live_ollama: requires native local Ollama and the configured model"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
