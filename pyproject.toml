[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-security-intelligence-copilot"
version = "0.1.0"
description = "Local, synthetic enterprise security intelligence demonstration"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
