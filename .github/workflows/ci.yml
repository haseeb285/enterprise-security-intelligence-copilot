name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.lock
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run Ruff lint
        run: python -m ruff check .
      - name: Run Ruff format check
        run: python -m ruff format --check .

  tests:
    name: Tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: esic_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: esic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esic_ci -d esic_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://esic_ci:ci-only-not-a-secret@127.0.0.1:5432/esic_ci
      RUN_LIVE_OLLAMA: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.lock
      - name: Upgrade ephemeral database
        run: python -m alembic upgrade head
      - name: Seed deterministic synthetic data
        run: python -m app.db.seed --ground-truth-path "${RUNNER_TEMP}/ground_truth.json"
      - name: Check migration consistency
        run: python -m alembic check
      - name: Run ordinary tests
        run: python -m pytest -m "not live_ollama and not qdrant_integration"

  containers:
    name: Compose and container builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_USER: esic_ci
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_DB: esic_ci
      DEMO_API_TOKEN: ci-admin-token-placeholder-000001
      DEMO_READ_TOKEN: ci-reader-token-placeholder-00001
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Compose configuration
        run: docker compose --profile bootstrap config --quiet
      - name: Build application images
        run: docker compose --profile bootstrap build api streamlit train
      - name: Verify hosted-runner image architecture
        run: |
          for image in esic-api:phase12 esic-streamlit:phase12 esic-trainer:phase12; do
            test "$(docker image inspect "$image" --format '{{.Architecture}}')" = "amd64"
          done
      - name: Verify excluded runtime files are absent
        run: |
          for image in esic-api:phase12 esic-streamlit:phase12 esic-trainer:phase12; do
            docker run --rm --entrypoint sh "$image" -c '
              test ! -e /app/.env
              test ! -e /app/.git
              test ! -e /app/data/runtime/ground_truth.json
              test ! -e /app/models/anomaly/isolation_forest_daily_v1.joblib
              test ! -e /app/mlflow.db
              test ! -e /app/evaluation
            '
          done
